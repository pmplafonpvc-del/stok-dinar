<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stok Dinar</title>
<meta name="description" content="Catat stok emas dinar & gram, offline.">
<meta name="theme-color" content="#2a2216">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stok Dinar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#f6f3ec;--card:#fffdf9;--ink:#211c13;--muted:#73695a;--line:#e8e0d0;
  --gold:#9a6d14;--gold-2:#c99a2e;--gold-soft:#f5ead0;
  --in:#1d7a4c;--in-soft:#e2f2e8;--out:#b03e2c;--out-soft:#f9e3dd;
  --warn:#8a5200;--warn-soft:#fff1d6;
  --hero1:#2a2216;--hero2:#4f3d1b;--heroInk:#fbf3df;
  --r:16px;--sh:0 1px 2px rgba(40,30,10,.06),0 6px 20px rgba(40,30,10,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#13110d;--card:#1d1a14;--ink:#f3ecdd;--muted:#a89f8d;--line:#332d22;
  --gold:#e2b752;--gold-2:#f0cd73;--gold-soft:#2e2615;
  --in:#56c78f;--in-soft:#15291e;--out:#f08a74;--out-soft:#34201b;
  --warn:#f2b55a;--warn-soft:#33270f;
  --hero1:#2a2216;--hero2:#3d3018;--sh:none;color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
.num,td,.big{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;line-height:1.2}
small,.muted{color:var(--muted)}
a{color:var(--gold)}

/* layout */
.app{display:flex;min-height:100vh}
nav.nav{background:var(--card);display:flex;z-index:30}
nav.nav button{border:0;background:none;display:flex;align-items:center;gap:10px;color:var(--muted);border-radius:12px}
nav.nav button svg{width:22px;height:22px;flex:none}
nav.nav button.on{color:var(--gold)}
.brand{display:none}
main{flex:1;min-width:0}
.wrap{max-width:1080px;margin:0 auto}
@media (max-width:899px){
  nav.nav{position:fixed;left:0;right:0;bottom:0;border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  nav.nav button{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:6px 0}
  main{padding:calc(14px + env(safe-area-inset-top)) 16px 100px}
}
@media (min-width:900px){
  nav.nav{flex-direction:column;width:228px;flex:none;position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:22px 14px;gap:4px}
  nav.nav button{padding:11px 14px;font-size:15px;font-weight:500}
  nav.nav button.on{background:var(--gold-soft)}
  .brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px;font-weight:700;font-size:17px}
  .brand img{width:34px;height:34px;border-radius:9px}
  main{padding:30px 40px 60px}
}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:24px;letter-spacing:-.01em}
.top p{margin:4px 0 0;color:var(--muted);font-size:14px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.card+.card,.stack>*+*{margin-top:14px}
.card h2{font-size:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols{display:grid;gap:14px}
@media (min-width:900px){.cols{grid-template-columns:1.15fr 1fr;align-items:start}}
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:var(--heroInk);border:0;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(240,205,115,.35),transparent 70%)}
.hero .lbl{font-size:13px;opacity:.8;display:flex;justify-content:space-between;align-items:center}
.hero .big{font-size:38px;font-weight:700;letter-spacing:-.02em;margin:6px 0 2px;color:#f6d77e}
.hero .sub{font-size:15px;opacity:.9}
.unit-tg{display:inline-flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px;position:relative;z-index:1}
.unit-tg button{border:0;background:none;color:inherit;padding:4px 12px;border-radius:999px;font-size:13px}
.unit-tg button.on{background:#f6d77e;color:#2a2216;font-weight:600}
.stat .k{font-size:12.5px;color:var(--muted)}
.grid2>.card{margin-top:0}
.stat .v{font-size:clamp(15px,4.4vw,20px);font-weight:700;margin-top:2px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .h{font-size:12px;color:var(--muted);margin-top:2px}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.act{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:14px;box-shadow:var(--sh)}
.act .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:700}
.act.in .ic{background:var(--in-soft);color:var(--in)}
.act.out .ic{background:var(--out-soft);color:var(--out)}
.act.pr .ic{background:var(--gold-soft);color:var(--gold)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#fff}
@media (prefers-color-scheme:dark){.btn.pri,.btn.in,.btn.out,.seg button.on[data-type]{color:#14110b!important}}
.btn.in{background:var(--in);border-color:var(--in);color:#fff}
.btn.out{background:var(--out);border-color:var(--out);color:#fff}
.btn.danger{color:var(--out);border-color:var(--out-soft)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.link{border:0;background:none;color:var(--gold);font-weight:600;padding:4px;font-size:14px}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.row-btns .btn{flex:1}

/* lists */
.list{margin:0 -16px}
.li{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li.click{cursor:pointer}
.li.click:hover{background:var(--gold-soft)}
.li .main{flex:1;min-width:0}
.li .main b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .main small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .r{text-align:right;flex:none}
.li .r b{display:block}
.badge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;font-size:15px}
.badge.in{background:var(--in-soft);color:var(--in)}
.badge.out{background:var(--out-soft);color:var(--out)}
.c-in{color:var(--in)}.c-out{color:var(--out)}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:14px 0 6px}
.grp:first-child{padding-top:0}
.dayhead{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600;padding:16px 2px 6px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.empty.sm{padding:14px}
.note{border-radius:12px;padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.info{background:var(--gold-soft);color:var(--ink)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:6px;vertical-align:-1px}

/* forms */
label.f{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:12px}
label.f input,label.f select,label.f textarea,.inp{display:block;width:100%;margin-top:5px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px;color:var(--ink);font-weight:500;min-height:46px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold-2);outline-offset:0;border-color:transparent}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{border:0;background:none;border-radius:10px;padding:10px;font-weight:700;color:var(--muted)}
.seg button.on[data-type=in]{background:var(--in);color:#fff}
.seg button.on[data-type=out]{background:var(--out);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;text-align:left;line-height:1.2;min-width:84px}
.chip b{display:block;font-size:14px}
.chip small{font-size:11.5px}
.chip.on{border-color:var(--gold);background:var(--gold-soft);box-shadow:0 0 0 1px var(--gold)}
.chip.dim{opacity:.45}
.qty{display:flex;align-items:center;gap:8px;margin:14px 0 6px}
.qty button{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:22px;font-weight:700;flex:none}
.qty input{flex:1;text-align:center;font-size:22px;font-weight:700;border:1px solid var(--line);background:var(--bg);border-radius:12px;height:48px;min-width:0}
.qty .u{min-width:56px;color:var(--muted);font-weight:600}
.calc{font-size:13.5px;color:var(--muted);min-height:20px;margin-bottom:12px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600;color:var(--muted)}
.pill.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.filters select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;font-size:14px;min-height:40px;max-width:100%}

/* price table */
.ptab{width:100%;border-collapse:collapse}
.ptab th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:4px 4px 6px}
.ptab td{padding:4px}
.ptab td:first-child{font-weight:600;font-size:14px;white-space:nowrap;padding-right:8px}
.ptab input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font-size:15px;text-align:right;min-height:42px;font-variant-numeric:tabular-nums;color:var(--ink)}
.ptab .d{display:block;font-size:11px;text-align:right;min-height:14px;font-weight:600}
.ptab tr.grow td{padding-top:14px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.sticky-save{position:sticky;bottom:72px;margin:14px -16px -16px;padding:12px 16px;background:var(--card);border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r);z-index:5}
@media (min-width:900px){.sticky-save{bottom:0}}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:right;font-size:12px;color:var(--muted);font-weight:600;padding:6px;border-bottom:1px solid var(--line)}
.tbl td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left;white-space:nowrap}
.tbl tfoot td{font-weight:700;border-bottom:0}
.scroll-x{overflow-x:auto;margin:0 -16px;padding:0 16px}

/* chart */
.chart{position:relative;width:100%;touch-action:pan-y}
.chart svg{display:block}
.chart text{fill:var(--muted);font-size:11px}
.tip{position:absolute;top:4px;background:var(--ink);color:var(--bg);font-size:12px;border-radius:8px;padding:6px 9px;pointer-events:none;white-space:nowrap;z-index:2}
.tip b{display:block}

/* modal */
.mwrap{position:fixed;inset:0;background:rgba(20,15,5,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@media (min-width:700px){.mwrap{align-items:center}.sheet{border-radius:22px;max-height:88vh}}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.shead h3{font-size:18px}
.x{border:0;background:var(--bg);width:36px;height:36px;border-radius:50%;font-size:20px;line-height:1}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.2);max-width:calc(100% - 32px);text-align:center}
@media (min-width:900px){.toast{bottom:28px}}

/* lock */
#lock{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,var(--hero1),#16120b);color:var(--heroInk);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px}
#lock.show{display:flex}
#lock img{width:64px;height:64px;border-radius:16px}
.dots{display:flex;gap:14px;height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #f6d77e}
.dots i.f{background:#f6d77e}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.keys button{height:72px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;font-size:26px;font-weight:500}
.keys button:active{background:rgba(255,255,255,.25)}
.keys button.t{background:none;font-size:15px}
.hide{display:none!important}
.sp{height:10px}
.right{text-align:right}
.mt{margin-top:12px}
</style>
</head>
<body>
<div class="app">
  <nav class="nav" id="nav">
    <div class="brand"><img src="icon.svg" alt="">Stok Dinar</div>
    <button data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Beranda</span></button>
    <button data-go="tx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg><span>Transaksi</span></button>
    <button data-go="price"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg><span>Harga</span></button>
    <button data-go="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg><span>Laporan</span></button>
    <button data-go="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Pengaturan</span></button>
  </nav>
  <main><div class="wrap" id="view"></div></main>
</div>

<div id="lock">
  <img src="icon.svg" alt="">
  <div style="font-weight:600;font-size:17px">Masukkan PIN</div>
  <div class="dots" id="dots"></div>
  <div class="keys" id="keys"></div>
</div>
<input type="file" id="fileIn" accept=".json,application/json" class="hide">

<script>
'use strict';
const VERSION = '1.2.1';
const KEY = 'stokdinar.v1';
const GPD = 4.25; // gram per 1 Dinar
const GROUPS = {
  dinar: {name: 'Dinar KR', priced: 'pc'},
  mr:    {name: 'MR Gold', priced: 'pc'},
  lain:  {name: 'Emas Lain', priced: 'gram'}
};
const GROUP_ORDER = ['dinar', 'mr', 'lain'];
const BASE_TS = '2026-01-01T00:00:00.000Z';

/* ---------- utils ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const pad = n => String(n).padStart(2, '0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const nowISO = () => new Date().toISOString();
const r6 = n => Math.round(n * 1e6) / 1e6;
function today() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function addDays(ds, n) { const [y, m, d] = ds.split('-').map(Number); const t = new Date(Date.UTC(y, m - 1, d + n)); return t.getUTCFullYear() + '-' + pad(t.getUTCMonth() + 1) + '-' + pad(t.getUTCDate()); }
function dms(ds) { const [y, m, d] = ds.split('-').map(Number); return Date.UTC(y, m - 1, d); }
function daysBetween(a, b) { return Math.round((dms(b) - dms(a)) / 864e5); }
const BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const BULAN_P = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
function fDate(ds, long) { if (!ds) return '—'; const [y, m, d] = ds.split('-').map(Number); if (long) { const w = new Date(Date.UTC(y, m - 1, d)).getUTCDay(); return HARI[w] + ', ' + d + ' ' + BULAN_P[m - 1] + ' ' + y; } return d + ' ' + BULAN[m - 1] + ' ' + y; }
function relDay(ds) { const n = daysBetween(ds, today()); if (n === 0) return 'hari ini'; if (n === 1) return 'kemarin'; if (n > 1) return n + ' hari lalu'; return fDate(ds); }
const fNum = (n, d = 3) => (n == null || isNaN(n)) ? '—' : Number(n).toLocaleString('id-ID', {maximumFractionDigits: d});
const fRp = n => (n == null || isNaN(n)) ? '—' : (n < 0 ? '−Rp ' : 'Rp ') + Math.round(Math.abs(n)).toLocaleString('id-ID');
const fG = n => fNum(n, 4) + ' g';
const fD = n => fNum(n, 3) + ' Dinar';
function fCompact(n) { const a = Math.abs(n), s = n < 0 ? '−' : ''; if (a >= 1e9) return s + fNum(a / 1e9, 2) + ' M'; if (a >= 1e6) return s + fNum(a / 1e6, 1) + ' jt'; if (a >= 1e3) return s + fNum(a / 1e3, 0) + ' rb'; return s + fNum(a, 2); }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseRp(s) { const d = String(s ?? '').replace(/\D/g, ''); return d ? Number(d) : null; }
function parseDec(s) { s = String(s ?? '').trim().replace(/\s/g, ''); if (!s) return NaN; if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); return Number(s); }
function rpInput(el) { el.addEventListener('input', () => { const n = parseRp(el.value); el.value = n == null ? '' : n.toLocaleString('id-ID'); }); }
function toast(msg, ms = 2400) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
function guessDevice() { const u = navigator.userAgent; if (/iPhone/.test(u)) return 'iPhone'; if (/iPad/.test(u)) return 'iPad'; if (/Android/.test(u)) return 'HP Android'; if (/Mac/.test(u)) return 'Mac'; if (/Windows/.test(u)) return 'PC Windows'; return 'Perangkat'; }

function applyBuiltinPrices(s) {

    const r = BUILTIN_PRICES[d], mine = s.prices[d];
    if (!mine || (mine.builtin && (mine.updatedAt || '') < r.updatedAt)) s.prices[d] = JSON.parse(JSON.stringify(r));

}
let S;
function load() {
  let s = null; try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!s || !Array.isArray(s.products)) s = freshState();
  for (const p of defaultProducts()) if (!s.products.find(x => x.id === p.id)) s.products.push(p);

let _pd = null;
function invalidate() { _pd = null; }
function priceDates() { if (!_pd) _pd = Object.keys(S.prices).filter(d => !S.prices[d].deleted).sort(); return _pd; }
const prod = id => S.products.find(p => p.id === id);
function products(all) {
  return S.products.filter(p => !p.deleted && (all || !p.hidden))
    .sort((a, b) => GROUP_ORDER.indexOf(a.group) - GROUP_ORDER.indexOf(b.group) || (!!a.bulk - !!b.bulk) || a.gram - b.gram || a.name.localeCompare(b.name));
}
const unitOf = p => p && p.bulk ? 'gram' : 'keping';
const fQty = (p, q) => p && p.bulk ? fNum(q, 4) + ' g' : fNum(q, 0) + ' keping';

// harga per satuan (per keping, atau per gram untuk "gram bebas") pada tanggal tertentu
function unitPrice(p, date) {
  const ds = priceDates();
  for (let i = ds.length - 1; i >= 0; i--) {
    const d = ds[i]; if (d > date) continue; const r = S.prices[d];
    if (GROUPS[p.group].priced === 'gram') {
      if (r.g && (r.g.b || r.g.s)) return {b: r.g.b ? r.g.b * p.gram : null, s: r.g.s ? r.g.s * p.gram : null, date: d};
    } else {
      const x = r.p && r.p[p.id];
      if (x && (x.b || x.s)) return {b: x.b || null, s: x.s || null, date: d};
    }
  }
  if (p.group === 'dinar' && p.id !== 'dinar-1') {
    const base = prod('dinar-1'); const u = base && unitPrice(base, date);
    if (u) { const k = p.gram / GPD; return {b: u.b && u.b * k, s: u.s && u.s * k, date: u.date, est: true}; }
  }
  return null;
}
function stockAt(to, from) {
  const m = {};
  for (const t of S.tx) {
    if (t.deleted) continue; if (to && t.date > to) continue; if (from && t.date < from) continue;
    m[t.pid] = r6((m[t.pid] || 0) + (t.type === 'in' ? t.qty : -t.qty));
  }
  return m;
}
function valuation(stock, date) {
  let gram = 0, b = 0, s = 0, est = false, oldest = null; const missing = [], rows = [];
  for (const p of products(true)) {
    const q = stock[p.id] || 0; if (!q) continue;
    const g = q * p.gram; gram += g;
    const u = unitPrice(p, date); let vb = null, vs = null;
    if (u) { if (u.b != null) { vb = u.b * q; b += vb; } if (u.s != null) { vs = u.s * q; s += vs; } if (u.est) est = true; if (!oldest || u.date < oldest) oldest = u.date; }
    else missing.push(p.name);
    rows.push({p, q, g, vb, vs, u});
  }
  return {gram: r6(gram), dinar: gram / GPD, b, s, est, oldest, missing, rows};
}
const activeTx = () => S.tx.filter(t => !t.deleted);

/* ---------- modal ---------- */
function openModal(html, mount) {
  closeModal();
  const w = document.createElement('div'); w.className = 'mwrap'; w.id = 'modal';
  w.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>';
  w.addEventListener('click', e => { if (e.target === w) closeModal(); });
  document.body.appendChild(w); document.body.style.overflow = 'hidden';
  if (mount) mount(w.firstChild);
}
function closeModal() { const m = $('#modal'); if (m) m.remove(); document.body.style.overflow = ''; }
const shead = t => `<div class="shead"><h3>${t}</h3><button class="x" data-act="close" aria-label="Tutup">×</button></div>`;
function ask(title, body, okLabel = 'Ya', danger) {
  // dialog konfirmasi bertumpuk di atas modal yang sedang terbuka
  return new Promise(res => {
    const w = document.createElement('div'); w.className = 'mwrap'; w.style.zIndex = 60;
    w.innerHTML = `<div class="sheet" role="alertdialog" aria-modal="true">${shead(title)}<p style="margin:0 0 18px">${body}</p><div class="row-btns"><button class="btn" data-a="0">Batal</button><button class="btn ${danger ? 'out' : 'pri'}" data-a="1">${okLabel}</button></div></div>`;
    w.addEventListener('click', e => {
      const b = e.target.closest('[data-a],[data-act=close]');
      if (e.target === w || b) { e.stopPropagation(); w.remove(); res(!!(b && b.dataset.a === '1')); }
    });
    document.body.appendChild(w);
  });
}

function txRow(t) {

}

/* ---------- FORM TRANSAKSI ---------- */
function openTxForm(type, tx) {
  let ttype = tx ? tx.type : type, sel = tx ? tx.pid : null;
  const html = shead(tx ? 'Ubah transaksi' : 'Catat emas') + `
    <div class="seg"><button data-type="in">▲ Masuk</button><button data-type="out">▼ Keluar</button></div>
    <label class="f">Tanggal<input type="date" id="fDate" value="${tx ? tx.date : today()}" max="${today()}"></label>
    <div class="f" style="font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px">Jenis emas</div>
    <div id="chips"></div>
    <div class="qty"><button type="button" data-step="-1" aria-label="Kurangi">−</button><input id="fQty" inputmode="decimal" value="${tx ? String(tx.qty).replace('.', ',') : '1'}" aria-label="Jumlah"><button type="button" data-step="1" aria-label="Tambah">+</button><span class="u" id="fUnit">keping</span></div>
    <div class="calc" id="fCalc"></div>
    <label class="f">Nominal Rp (opsional)<input id="fTotal" inputmode="numeric" placeholder="mis. harga beli / jual total" value="${tx && tx.total ? tx.total.toLocaleString('id-ID') : ''}"></label>
    <label class="f">Catatan (opsional)<input id="fNote" maxlength="120" placeholder="mis. beli di mitra, hadiah, dijual" value="${tx ? esc(tx.note || '') : ''}"></label>
    <div class="row-btns">${tx ? '<button class="btn danger" id="fDel">Hapus</button>' : '<button class="btn" id="fAgain">Simpan & tambah lagi</button>'}<button class="btn pri" id="fSave">Simpan</button></div>`;
  openModal(html, el => {
    const qtyEl = $('#fQty', el), dateEl = $('#fDate', el);
    rpInput($('#fTotal', el));
    const avail = pid => { const st = stockAt(); let q = st[pid] || 0; if (tx && tx.pid === pid) q = r6(q + (tx.type === 'out' ? tx.qty : -tx.qty)); return q; };
    function drawChips() {
      let h = '';
      for (const g of GROUP_ORDER) {
        const ps = products(false).filter(p => p.group === g || false);
        if (sel && !ps.find(p => p.id === sel) && prod(sel) && prod(sel).group === g) ps.push(prod(sel));
        if (!ps.length) continue;
        h += `<div class="grp">${GROUPS[g].name}</div><div class="chips">` + ps.map(p => {
          const a = avail(p.id);
          return `<button type="button" class="chip ${p.id === sel ? 'on' : ''} ${ttype === 'out' && a <= 0 ? 'dim' : ''}" data-pid="${p.id}"><b>${esc(p.name.replace(/^MR Gold /, '').replace(/^Emas (?=\d)/, ''))}</b><small>${a ? 'stok ' + fNum(a, 4) : (p.bulk ? 'berat bebas' : p.group === 'mr' ? 'MR Gold' : fNum(p.gram, 4) + ' g')}</small></button>`;
        }).join('') + '</div>';
      }
      $('#chips', el).innerHTML = h;
      $$('.seg button', el).forEach(b => b.classList.toggle('on', b.dataset.type === ttype));
      $('#fSave', el).className = 'btn ' + (ttype === 'in' ? 'in' : 'out');
      calc();
    }
    function calc() {
      const p = sel && prod(sel); const q = parseDec(qtyEl.value);
      $('#fUnit', el).textContent = unitOf(p);
      if (!p) { $('#fCalc', el).textContent = 'Pilih jenis emas di atas'; return; }
      if (!(q > 0)) { $('#fCalc', el).textContent = ''; return; }
      const g = q * p.gram; const u = unitPrice(p, dateEl.value || today());
      let t = `${p.bulk ? '' : fNum(q, 0) + ' × '}${p.name.replace(/ \(gram bebas\)$/, '')} = ${fG(g)} ≈ ${fD(g / GPD)}`;
      if (u) { const v = ttype === 'in' ? u.b : u.s; if (v) t += ` · ≈ ${fRp(v * q)} (${ttype === 'in' ? 'harga beli' : 'buyback'})`; }
      if (ttype === 'out') t += ` · stok ${fQty(p, avail(p.id))}`;
      $('#fCalc', el).textContent = t;
    }
    el.addEventListener('click', e => {
      const c = e.target.closest('[data-pid]'); if (c) { sel = c.dataset.pid; drawChips(); return; }
      const s = e.target.closest('[data-type]'); if (s) { ttype = s.dataset.type; drawChips(); return; }
      const st = e.target.closest('[data-step]'); if (st) { const q = parseDec(qtyEl.value) || 0; const p = sel && prod(sel); const step = p && p.bulk ? 0.1 : 1; qtyEl.value = String(Math.max(0, r6(q + step * +st.dataset.step))).replace('.', ','); calc(); }
      if (e.target.closest('[data-act=close]')) closeModal();
    });
    qtyEl.addEventListener('input', calc); dateEl.addEventListener('change', calc);
    async function doSave(again) {
      const p = sel && prod(sel); const q = parseDec(qtyEl.value);
      if (!p) return toast('Pilih jenis emas dulu');
      if (!(q > 0)) return toast('Isi jumlah dengan benar');
      if (!p.bulk && !Number.isInteger(q)) return toast('Jumlah keping harus bilangan bulat');
      const date = dateEl.value || today();
      if (ttype === 'out') { const a = avail(p.id); if (q > a + 1e-9 && !(await ask('Stok tidak cukup', `Stok ${esc(p.name)} saat ini ${fQty(p, a)}, mau keluar ${fQty(p, q)}. Tetap simpan?`, 'Tetap simpan', true))) return; }
      const rec = Object.assign(tx ? {...tx} : {id: uid(), createdAt: nowISO()}, {
        type: ttype, pid: p.id, qty: q, date, total: parseRp($('#fTotal', el).value), note: $('#fNote', el).value.trim(), updatedAt: nowISO(), dev: S.device.name});
      if (tx) S.tx[S.tx.findIndex(x => x.id === tx.id)] = rec; else S.tx.push(rec);
      save(); render();
      toast((ttype === 'in' ? '▲ Masuk ' : '▼ Keluar ') + fQty(p, q) + ' ' + p.name);
      if (again && !tx) { qtyEl.value = '1'; $('#fTotal', el).value = ''; $('#fNote', el).value = ''; sel = null; drawChips(); }
      else closeModal();
    }
    $('#fSave', el).onclick = () => doSave(false);
    if ($('#fAgain', el)) $('#fAgain', el).onclick = () => doSave(true);
    if ($('#fDel', el)) $('#fDel', el).onclick = async () => {
      const p = prod(tx.pid);
      if (!(await ask('Hapus transaksi?', `${tx.type === 'in' ? 'Masuk' : 'Keluar'} ${fQty(p, tx.qty)} ${esc(p ? p.name : '')} tanggal ${fDate(tx.date)} akan dihapus.`, 'Hapus', true))) return;
      Object.assign(S.tx.find(x => x.id === tx.id), {deleted: true, updatedAt: nowISO()}); save(); closeModal(); render(); toast('Transaksi dihapus');
    };
    drawChips();

let PDATE = null;
function priceBase(date) {
  // nilai awal form: data tanggal itu, atau harga terakhir sebelumnya per item

  const val = {}, prev = {};

  for (const p of products(true)) {
    if (GROUPS[p.group].priced !== 'pc') continue;
    prev[p.id] = lastOf(r => r.p && r.p[p.id] && (r.p[p.id].b || r.p[p.id].s) ? r.p[p.id] : null);
    val[p.id] = (rec && rec.p && rec.p[p.id]) || prev[p.id];
  }
  prev.gram = lastOf(r => r.g && (r.g.b || r.g.s) ? r.g : null);
  val.gram = (rec && rec.g && (rec.g.b || rec.g.s)) ? rec.g : prev.gram;
  return {rec, val, prev, from: rec ? date : ds.slice(-1)[0]};
}

function parsePriceText(txt) {
  txt = txt.replace(/⅛/g, '1/8').replace(/¼/g, '1/4').replace(/½/g, '1/2');
  const labels = [];
  const fracMap = {'1/16': '0.0625', '1/8': '0.125', '1/4': '0.25', '1/2': '0.5'};
  let m; const reD = /(\d+\s*\/\s*\d+|\b\d{1,2})\s*dinar\b/gi;
  while ((m = reD.exec(txt))) { const k = m[1].replace(/\s/g, ''); const key = fracMap[k] || k; if (prod('dinar-' + key)) labels.push({i: m.index, end: reD.lastIndex, pid: 'dinar-' + key}); }
  const reM = /mr\s*\.?\s*gold\s*(0[.,]\d+)/gi;
  while ((m = reM.exec(txt))) { const g = Number(m[1].replace(',', '.')); if (prod('mr-' + g)) labels.push({i: m.index, end: reM.lastIndex, pid: 'mr-' + g}); }
  const reG = /(?:per|\/)\s*gram/gi;
  while ((m = reG.exec(txt))) labels.push({i: m.index, end: reG.lastIndex, pid: 'gram'});
  labels.sort((a, b) => a.i - b.i);
  const out = {};
  labels.forEach((l, j) => {
    const seg = txt.slice(l.end, j + 1 < labels.length ? labels[j + 1].i : txt.length);
    const nums = (seg.match(/\d{1,3}(?:\.\d{3})+|\d{5,}/g) || []).map(s => Number(s.replace(/\D/g, ''))).filter(n => n >= 1000);
    if (nums.length) out[l.pid] = {b: nums[0], s: nums[1] || null};
  });
  return out;
}

/* ---------- LAPORAN ---------- */
const RP = {preset: 'month', from: null, to: null, pid: 'dinar-1'};
function periodRange() {
  const td = today(), y = +td.slice(0, 4), mo = +td.slice(5, 7);
  const firstAll = [activeTx().map(t => t.date).sort()[0], priceDates()[0]].filter(Boolean).sort()[0] || td;
  switch (RP.preset) {
    case 'month': return [td.slice(0, 8) + '01', td];
    case 'last': { const ly = mo === 1 ? y - 1 : y, lm = mo === 1 ? 12 : mo - 1; return [ly + '-' + pad(lm) + '-01', addDays(y + '-' + pad(mo) + '-01', -1)]; }
    case '3m': return [addDays(td, -90), td];
    case 'year': return [y + '-01-01', td];
    case 'custom': return [RP.from || td.slice(0, 8) + '01', RP.to || td];
    default: return [firstAll, td];
  }
}
function seriesDates(from, to) {
  const set = new Set([from, to]);
  priceDates().forEach(d => { if (d >= from && d <= to) set.add(d); });
  activeTx().forEach(t => { if (t.date >= from && t.date <= to) set.add(t.date); });
  let ds = [...set].sort();
  if (ds.length > 400) { const k = Math.ceil(ds.length / 400); ds = ds.filter((d, i) => i % k === 0 || i === ds.length - 1); }
  return ds;
}

/* ---------- grafik (SVG, tanpa internet) ---------- */
function chartHTML(cfg) { CHARTS.push(cfg); return `<div class="chart" data-chart="${CHARTS.length - 1}"></div>`; }
function drawCharts() { $$('[data-chart]').forEach(el => { const c = CHARTS[+el.dataset.chart]; if (c) drawChart(el, c); }); }
function drawChart(el, cfg) {
  const ser = cfg.series.filter(s => s.pts.length);
  const all = ser.flatMap(s => s.pts);
  if (!all.length) { el.innerHTML = '<div class="empty sm">Belum ada data untuk grafik di periode ini</div>'; return; }
  const W = Math.max(260, el.clientWidth), H = cfg.h || 210, pl = cfg.money ? 58 : 48, pr = 10, pt = 10, pb = 26;
  const ts = all.map(p => p[0]), vs = all.map(p => p[1]);
  let t0 = Math.min(...ts), t1 = Math.max(...ts); if (t0 === t1) { t0 -= 3 * 864e5; t1 += 3 * 864e5; }
  let v0 = Math.min(...vs), v1 = Math.max(...vs); if (cfg.zero) v0 = Math.min(0, v0);
  if (v0 === v1) { const d = Math.abs(v0) * .05 || 1; v0 -= d; v1 += d; }
  const pv = (v1 - v0) * .08; v1 += pv; if (!cfg.zero) v0 -= pv;
  const X = t => pl + (t - t0) / (t1 - t0) * (W - pl - pr), Y = v => pt + (1 - (v - v0) / (v1 - v0)) * (H - pt - pb);
  const yf = v => cfg.money ? fCompact(v) : fNum(v, 2);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = v0 + (v1 - v0) * i / 4, y = Y(v); g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl - 6}" y="${y + 4}" text-anchor="end">${yf(v)}</text>`; }
  const nx = Math.max(2, Math.min(5, Math.floor(W / 110)));
  for (let i = 0; i < nx; i++) { const t = t0 + (t1 - t0) * i / (nx - 1); const d = new Date(t); const lbl = d.getUTCDate() + ' ' + BULAN[d.getUTCMonth()] + (t1 - t0 > 300 * 864e5 ? ' ' + String(d.getUTCFullYear()).slice(2) : ''); g += `<text x="${X(t)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === nx - 1 ? 'end' : 'middle'}">${lbl}</text>`; }
  let paths = '';
  ser.forEach((s, si) => {
    const pts = s.pts.slice().sort((a, b) => a[0] - b[0]);
    let d = '';
    pts.forEach((p, i) => { const x = X(p[0]), y = Y(p[1]); if (i === 0) d += `M${x},${y}`; else if (cfg.step) d += `H${x}V${y}`; else d += `L${x},${y}`; });
    if (cfg.area && si === 0 && pts.length > 1) paths += `<path d="${d}V${Y(Math.max(v0, Math.min(0, v1)) )}H${X(pts[0][0])}Z" fill="${s.color}" opacity=".12"/>`;
    paths += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (pts.length <= 40) pts.forEach(p => paths += `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="${pts.length === 1 ? 4 : 2.5}" fill="${s.color}"/>`);
  });
  el.innerHTML = `<svg width="${W}" height="${H}" role="img">${g}${paths}<line class="hl" y1="${pt}" y2="${H - pb}" stroke="var(--muted)" stroke-dasharray="3 3" style="display:none"/><g class="hd"></g></svg><div class="tip" style="display:none"></div>`
    + (cfg.series.length > 1 ? `<div class="legend">${cfg.series.map(s => `<span style="--c:${s.color}">${s.name}</span>`).join('')}</div>` : '');
  const svg = $('svg', el), hl = $('.hl', el), hd = $('.hd', el), tip = $('.tip', el);
  const uts = [...new Set(ts)].sort((a, b) => a - b);

    const idx = new Map(arr.map((x, i) => [x.id, i]));

      if (!x || !x.id) continue; const i = idx.get(x.id);
      if (i == null) { arr.push(x); idx.set(x.id, arr.length - 1); added++; }

}

function openPinSet() {
  openModal(shead('Pasang PIN') + `
    <label class="f">PIN baru (4–6 angka)<input id="p1" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>
    <label class="f">Ulangi PIN<input id="p2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>
    <p class="muted" style="font-size:13px;margin:0 0 12px">Ingat baik-baik. Jika lupa PIN, data hanya bisa dipulihkan dari file backup.</p>
    <button class="btn pri block" id="pS">Simpan PIN</button>`, el => {
    $('[data-act=close]', el).onclick = closeModal;
    $('#pS', el).onclick = async () => {
      const a = $('#p1', el).value, b = $('#p2', el).value;
      if (!/^\d{4,6}$/.test(a)) return toast('PIN harus 4–6 angka');
      if (a !== b) return toast('PIN tidak sama');
      S.settings.pinSalt = uid(); S.settings.pinHash = await hashPin(a, S.settings.pinSalt); save(); closeModal(); render(); toast('✓ PIN dipasang');
    };
  });
}
let pinBuf = '', hiddenAt = 0;
function lock() {
  if (!S.settings.pinHash) return; pinBuf = ''; drawDots(); $('#lock').classList.add('show'); closeModal();
}
function drawDots() { $('#dots').innerHTML = Array.from({length: 6}, (_, i) => `<i class="${i < pinBuf.length ? 'f' : ''}"></i>`).join(''); }
async function pinKey(k) {
  if (k === 'del') pinBuf = pinBuf.slice(0, -1);
  else if (pinBuf.length < 6) pinBuf += k;
  drawDots();
  if (pinBuf.length >= 4) {
    const h = await hashPin(pinBuf, S.settings.pinSalt);
    if (h === S.settings.pinHash) { $('#lock').classList.remove('show'); pinBuf = ''; }
    else if (pinBuf.length === 6) { const d = $('#dots'); d.classList.add('shake'); setTimeout(() => { d.classList.remove('shake'); pinBuf = ''; drawDots(); }, 380); }
  }
}
function initLock() {
  $('#keys').innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${n}</button>`).join('') + '<span></span><button data-k="0">0</button><button class="t" data-k="del">Hapus</button>';
  $('#keys').onclick = e => { const b = e.target.closest('[data-k]'); if (b) pinKey(b.dataset.k); };
  document.addEventListener('keydown', e => { if (!$('#lock').classList.contains('show')) return; if (/^\d$/.test(e.key)) pinKey(e.key); else if (e.key === 'Backspace') pinKey('del'); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) hiddenAt = Date.now(); else if (hiddenAt && Date.now() - hiddenAt > 120000) lock(); });
}

/* ---------- aksi ---------- */
const ACT = {
  close: closeModal,
  txin: () => openTxForm('in'),
  txout: () => openTxForm('out'),
  edit: el => { const t = S.tx.find(x => x.id === el.dataset.id); if (t) openTxForm(t.type, t); },
  psave: savePrices,
  pdel: async () => { const d = PDATE || today(); if (await ask('Hapus harga?', 'Harga tanggal ' + fDate(d) + ' akan dihapus.', 'Hapus', true)) { S.prices[d] = {date: d, deleted: true, updatedAt: nowISO()}; save(); render(); toast('Harga dihapus'); } },
  pdate: el => { PDATE = el.dataset.d; render(); window.scrollTo(0, 0); },
  paste: openPaste,
  xlsx: exportExcel,
  backup: () => doBackup(false),
  share: () => doBackup(true),
  import: () => { const f = $('#fileIn'); f.value = ''; f.click(); },
  pinset: openPinSet,
  pinoff: async () => { if (await ask('Matikan PIN?', 'Aplikasi tidak akan terkunci lagi.', 'Matikan', true)) { S.settings.pinHash = null; save(); render(); toast('PIN dimatikan'); } },
  padd: openAddProduct,
  phide: el => { const p = prod(el.dataset.id); p.hidden = !p.hidden; p.updatedAt = nowISO(); save(); render(); },
  pdelp: async el => {
    const p = prod(el.dataset.id); const used = activeTx().some(t => t.pid === p.id);
    if (used) return toast('Jenis ini sudah dipakai di transaksi — sembunyikan saja', 3500);
    if (await ask('Hapus jenis?', esc(p.name) + ' akan dihapus.', 'Hapus', true)) { p.deleted = true; p.updatedAt = nowISO(); save(); render(); }
  },
  wipe: () => {
    openModal(shead('Hapus semua data') + `<p style="margin:0 0 12px">Ketik <b>HAPUS</b> untuk menghapus semua transaksi & harga di perangkat ini. Tidak bisa dibatalkan.</p><input class="inp" id="wC" autocomplete="off"><button class="btn out block mt" id="wGo">Hapus semua</button>`, el => {
      $('[data-act=close]', el).onclick = closeModal;
      $('#wGo', el).onclick = () => { if ($('#wC', el).value.trim().toUpperCase() !== 'HAPUS') return toast('Ketik HAPUS untuk konfirmasi'); const keep = {device: S.device, settings: S.settings}; S = freshState(); S.prices = {}; Object.assign(S, keep); save(); closeModal(); go('home'); toast('Semua data dihapus'); };
    });
  }
};
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g && !e.target.closest('#modal')) { if (g.dataset.go === 'price') PDATE = null; return go(g.dataset.go); }
  const u = e.target.closest('[data-unit]'); if (u) { S.ui.unit = u.dataset.unit; save(); return render(); }
  const p = e.target.closest('[data-preset]'); if (p) { RP.preset = p.dataset.preset; return render(); }
  const a = e.target.closest('[data-act]');
  if (a && ACT[a.dataset.act] && !a.closest('#modal')) ACT[a.dataset.act](a, e); // tombol di dalam modal ditangani modalnya sendiri
});
document.addEventListener('change', e => { const f = e.target.closest('[data-f]'); if (f && f.tagName === 'SELECT' && VIEW === 'tx') { TXF[f.dataset.f] = f.value; render(); } });
$('#fileIn').addEventListener('change', e => { const f = e.target.files[0]; if (f) importFile(f); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
let rsT; window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(drawCharts, 150); });

/* ---------- start ---------- */
S = load(); save();
initLock();
render();
if (S.settings.pinHash) lock();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
